<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f1"><meta name="description" content="Your personal training journal. Plan your week, log every set, and see how far you have come."><title>FORM — Your training journal</title>
<link rel="icon" href="./workout/icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./workout/styles.css"><script src="./workout/config.js"></script><script type="module" src="./workout/app.mjs"></script>
</head><body>
<header class="site-header"><a class="brand" href="#week" aria-label="FORM home"><span class="brand-icon">f<span>.</span></span><span>FORM<small>YOUR TRAINING JOURNAL</small></span></a><nav class="main-nav" aria-label="Main navigation"><a href="#week" data-page="week"><span data-icon="calendar"></span>This week</a><a href="#history" data-page="history"><span data-icon="history"></span>History</a></nav><button class="account-button" id="account-button"><span class="status-dot"></span><span id="account-label">On this device</span><span data-icon="user"></span></button></header>
<main id="app" tabindex="-1"></main>
<footer class="site-footer"><span>One set at a time.</span><span>Made for your everyday progress <span class="orange">↗</span></span></footer>
<nav class="mobile-nav" aria-label="Mobile navigation"><a href="#week" data-page="week"><span data-icon="calendar"></span>This week</a><button id="mobile-add" aria-label="Add exercise"><span data-icon="plus"></span></button><a href="#history" data-page="history"><span data-icon="history"></span>History</a></nav>
<dialog id="editor" class="sheet"><form id="exercise-form"><div class="sheet-handle"></div><div class="dialog-head"><div><span class="eyebrow" id="editor-kicker">MAKE ROOM FOR PROGRESS</span><h2 id="editor-title">Add an exercise</h2></div><button type="button" class="icon-button" data-close="editor" aria-label="Close editor"><span data-icon="close"></span></button></div><div id="editor-body"></div><p class="form-error" id="editor-error" role="alert"></p><div class="dialog-actions"><button type="button" class="button danger" id="delete-exercise">Remove</button><button type="button" class="button secondary" data-close="editor">Cancel</button><button type="submit" class="button primary" id="save-exercise">Save exercise <span data-icon="arrow"></span></button></div></form></dialog>
<dialog id="account" class="sheet account-sheet"><div class="sheet-handle"></div><div class="dialog-head"><div><span class="eyebrow">TAKE YOUR PROGRESS WITH YOU</span><h2>Your journal</h2></div><button class="icon-button" data-close="account" aria-label="Close account"><span data-icon="close"></span></button></div><div id="account-body"></div></dialog>
<dialog id="confirm" class="sheet confirm-sheet"><div class="dialog-head"><h2 id="confirm-title"></h2></div><p id="confirm-message"></p><div class="dialog-actions"><button class="button secondary" id="confirm-cancel">Cancel</button><button class="button primary" id="confirm-ok">Confirm</button></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div><noscript><p>Enable JavaScript in your browser to use your workout journal.</p></noscript>
</body></html>
